name: CI

# On demand only. GitHub Actions stays disabled on this repository between
# verification runs to protect the Actions quota; a run is started by hand
# (`gh workflow run ci.yml`) or by release.yml, which calls this workflow so a
# tag is never published from a commit these checks did not pass.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every `uses:` is pinned to a full commit SHA (P-LEASTPRIV, zizmor
# unpinned-uses): a tag is mutable, so `@v7` lets the tag's owner change what
# this repository runs with the token it hands it. The trailing comment names
# the tag the SHA came from, so a bump is a readable diff.
jobs:
  backend:
    # Windows, because most of what is tested here only exists there (winreg,
    # ctypes.WinDLL, PowerShell). One leg, on the interpreter the executable
    # ships with: a second leg doubles the Windows minutes for a version no
    # user runs.
    name: Backend (lint + type + test)
    # About twice a normal run: a hung test stops here instead of burning
    # Actions minutes until GitHub's 6-hour default.
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The secret scan reads history, not just the tree: a credential that
          # was committed and then deleted is still in the clone.
          fetch-depth: 0
          # artipacked: nothing in this workflow pushes with git, so the job
          # token is not left on disk for a later step (or an artifact) to pick up.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      # --locked fails when uv.lock no longer matches pyproject.toml, which
      # --frozen would silently install around.
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Verify the project interpreter
        run: |
          uv run --extra dev python -c "import sys, pytest; print(f'ci: {sys.executable} | pytest {pytest.__version__}')"

      - name: Ruff lint
        run: uv run --extra dev ruff check src tests scripts

      - name: Ruff format check
        run: uv run --extra dev ruff format --check src tests scripts

      - name: Mypy
        run: uv run --extra dev mypy src

      # P-DIP/P-SOC/P-SRP: the layer contract, as a check rather than a drawing.
      - name: Import layering
        run: uv run --extra dev lint-imports

      # P-YAGNI/P-DELETE/P-SPECGEN: dead code and unused flags.
      - name: Dead code
        run: uv run --extra dev vulture src/fpstune vulture_whitelist.py --min-confidence 80

      # P-LEASTPRIV: every action pinned to a SHA, every token least-privilege.
      - name: Workflow security (zizmor)
        run: uv run --extra dev zizmor .github/workflows

      # P-SSOT/P-SHIFTLEFT: this workflow, quality.sh and lefthook.yml agree
      # with the one control registry.
      - name: Control registry
        run: uv run --extra dev python scripts/controls.py --check

      # P-SECRETS: the real scanner is the CI gate of record. Locally the
      # dependency-free test is the gate because gitleaks is not a project
      # dependency (a contributor must not need it to commit).
      - name: Secret scan (gitleaks)
        shell: pwsh
        run: |
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip"
          Invoke-WebRequest $url -OutFile gitleaks.zip
          Expand-Archive gitleaks.zip -DestinationPath .
          .\gitleaks.exe git --redact --config .gitleaks.toml

      - name: Pytest (coverage gate)
        run: uv run --extra dev pytest --cov=src/fpstune --cov-report=term-missing --cov-report=json:coverage.json

      # P-RISKTEST: the critical modules' measured floors, from the run above.
      - name: Critical-module coverage floors
        run: uv run --extra dev python scripts/risk_coverage.py --json coverage.json

  frontend:
    # Nothing in the UI build or its tests depends on the host OS, and a Linux
    # minute costs half a Windows one.
    name: Frontend (type + build + lint + test + a11y)
    # About twice a normal run: a hung test stops here instead of burning
    # Actions minutes until GitHub's 6-hour default.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # artipacked: nothing in this workflow pushes with git, so the job
          # token is not left on disk for a later step (or an artifact) to pick up.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Lint
        run: npm run lint

      # P-YAGNI/P-DELETE/P-SPECGEN: unused exports, files and dependencies.
      - name: Unused code (knip)
        run: npm run knip

      # P-DIP/P-SOC/P-COHESION: the UI's layer rules.
      - name: Dependency direction (dependency-cruiser)
        run: npm run deps:check

      # P-DRY over both trees: the UI's zero-clone baseline plus the Python
      # side, with the threshold in the root .jscpd.json.
      - name: Duplication (jscpd)
        run: node_modules/.bin/jscpd --config ../.jscpd.json ../src/fpstune src

      - name: Test
        run: npm run test:run

      # Browser-level a11y: axe's colour-contrast rule needs computed styles
      # jsdom does not produce, so this runs in real Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe, WCAG 2.1 AA)
        run: npm run test:a11y

  package:
    # The executable is what users run, so it is what gets proven: built from
    # this commit, started, and asked to serve its UI and its settings. A
    # `--version` check alone answers before the API is ever imported, which is
    # how a broken import graph could ship.
    name: Package (build + start + serve)
    # About twice a normal run: a hung test stops here instead of burning
    # Actions minutes until GitHub's 6-hour default.
    timeout-minutes: 20
    needs: [backend, frontend]
    runs-on: windows-latest
    env:
      # Close to a single-file build's real size: a build that suddenly doubles
      # has pulled in something it should not.
      MAX_SIZE_MB: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # artipacked: nothing in this workflow pushes with git, so the job
          # token is not left on disk for a later step (or an artifact) to pick up.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: PyInstaller
        run: uv run pyinstaller fpstune.spec --noconfirm

      - name: Size ceiling
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item ".\dist\fpstune.exe").Length / 1MB, 1)
          Write-Host "fpstune.exe is $mb MB"
          if ($mb -gt $env:MAX_SIZE_MB) { Write-Error "over the $env:MAX_SIZE_MB MB ceiling"; exit 1 }

      - name: The executable starts and serves
        shell: pwsh
        run: |
          $port = 18765
          $proc = Start-Process -FilePath ".\dist\fpstune.exe" `
            -ArgumentList "serve", "--no-browser", "--port", "$port" `
            -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          try {
            $base = "http://127.0.0.1:$port"
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($proc.HasExited) { break }
              try {
                $h = Invoke-RestMethod "$base/health" -TimeoutSec 2
                if ($h.status) { $healthy = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $healthy) { throw "fpstune.exe never answered /health" }
            Write-Host "health: $($h | ConvertTo-Json -Compress)"

            $page = Invoke-WebRequest "$base/ui/" -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<div id="root">') {
              throw "/ui/ did not serve the bundled index.html"
            }
            # Vite builds with base './', so the page names its assets relatively.
            $asset = [regex]::Match($page.Content, 'assets/[^"]+\.js').Value
            if (-not $asset) { throw "index.html names no script asset" }
            $js = Invoke-WebRequest "$base/ui/$asset" -UseBasicParsing
            if ($js.StatusCode -ne 200 -or $js.RawContentLength -lt 1000) { throw "$asset was not served" }

            $defs = $null
            for ($i = 0; $i -lt 90; $i++) {
              try {
                $defs = Invoke-RestMethod "$base/api/settings/definitions" -TimeoutSec 30
                if ($defs.Count -gt 0) { break }
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $defs -or $defs.Count -eq 0) { throw "/api/settings/definitions returned nothing" }
            Write-Host "definitions: $($defs.Count)"
          } finally {
            if (-not $proc.HasExited) { & taskkill.exe /PID $proc.Id /T /F | Out-Null }
            Write-Host "--- stdout ---"; Get-Content out.log -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content err.log -ErrorAction SilentlyContinue
          }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\fpstune.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  fpstune.exe" | Out-File -FilePath "dist/fpstune.exe.sha256" -Encoding ascii -NoNewline
          Write-Host "sha256 $hash"

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fpstune-exe
          path: |
            dist/fpstune.exe
            dist/fpstune.exe.sha256
          retention-days: 14
