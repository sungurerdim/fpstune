name: CI

# On demand only. GitHub Actions stays disabled on this repository between
# verification runs to protect the Actions quota; a run is started by hand
# (`gh workflow run ci.yml`) or by release.yml, which calls this workflow so a
# tag is never published from a commit these checks did not pass.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # Windows, because most of what is tested here only exists there (winreg,
    # ctypes.WinDLL, PowerShell). One leg, on the interpreter the executable
    # ships with: a second leg doubles the Windows minutes for a version no
    # user runs.
    name: Backend (lint + type + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails when uv.lock no longer matches pyproject.toml, which
      # --frozen would silently install around.
      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Pytest (coverage gate)
        run: uv run pytest --cov=src/fpstune --cov-report=term-missing

  frontend:
    # Nothing in the UI build or its tests depends on the host OS, and a Linux
    # minute costs half a Windows one.
    name: Frontend (type + build + lint + test + a11y)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      # Browser-level a11y: axe's colour-contrast rule needs computed styles
      # jsdom does not produce, so this runs in real Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe, WCAG 2.1 AA)
        run: npm run test:a11y

  package:
    # The executable is what users run, so it is what gets proven: built from
    # this commit, started, and asked to serve its UI and its settings. A
    # `--version` check alone answers before the API is ever imported, which is
    # how a broken import graph could ship.
    name: Package (build + start + serve)
    needs: [backend, frontend]
    runs-on: windows-latest
    env:
      # Close to a single-file build's real size: a build that suddenly doubles
      # has pulled in something it should not.
      MAX_SIZE_MB: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: PyInstaller
        run: uv run pyinstaller fpstune.spec --noconfirm

      - name: Size ceiling
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item ".\dist\fpstune.exe").Length / 1MB, 1)
          Write-Host "fpstune.exe is $mb MB"
          if ($mb -gt $env:MAX_SIZE_MB) { Write-Error "over the $env:MAX_SIZE_MB MB ceiling"; exit 1 }

      - name: The executable starts and serves
        shell: pwsh
        run: |
          $port = 18765
          $proc = Start-Process -FilePath ".\dist\fpstune.exe" `
            -ArgumentList "serve", "--no-browser", "--port", "$port" `
            -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          try {
            $base = "http://127.0.0.1:$port"
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($proc.HasExited) { break }
              try {
                $h = Invoke-RestMethod "$base/health" -TimeoutSec 2
                if ($h.status) { $healthy = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $healthy) { throw "fpstune.exe never answered /health" }
            Write-Host "health: $($h | ConvertTo-Json -Compress)"

            $page = Invoke-WebRequest "$base/ui/" -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch '<div id="root">') {
              throw "/ui/ did not serve the bundled index.html"
            }
            # Vite builds with base './', so the page names its assets relatively.
            $asset = [regex]::Match($page.Content, 'assets/[^"]+\.js').Value
            if (-not $asset) { throw "index.html names no script asset" }
            $js = Invoke-WebRequest "$base/ui/$asset" -UseBasicParsing
            if ($js.StatusCode -ne 200 -or $js.RawContentLength -lt 1000) { throw "$asset was not served" }

            $defs = $null
            for ($i = 0; $i -lt 90; $i++) {
              try {
                $defs = Invoke-RestMethod "$base/api/settings/definitions" -TimeoutSec 30
                if ($defs.Count -gt 0) { break }
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $defs -or $defs.Count -eq 0) { throw "/api/settings/definitions returned nothing" }
            Write-Host "definitions: $($defs.Count)"
          } finally {
            if (-not $proc.HasExited) { & taskkill.exe /PID $proc.Id /T /F | Out-Null }
            Write-Host "--- stdout ---"; Get-Content out.log -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content err.log -ErrorAction SilentlyContinue
          }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\fpstune.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  fpstune.exe" | Out-File -FilePath "dist/fpstune.exe.sha256" -Encoding ascii -NoNewline
          Write-Host "sha256 $hash"

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: fpstune-exe
          path: |
            dist/fpstune.exe
            dist/fpstune.exe.sha256
          retention-days: 14
