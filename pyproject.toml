[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpstune"
version = "0.1.0"
description = "Windows gaming performance optimization tool"
readme = "README.md"
license = "MIT"
# The floor is the oldest version CI runs, and nothing else. Raised from 3.11
# because nothing was holding it there — no dependency in uv.lock stops at 3.11
# and no syntax in src/ needs it — while nothing ran it either. An untested
# floor is a promise about an interpreter nobody ever started. Keep this, the
# classifiers, ruff's target-version, mypy's python_version and the CI matrix
# telling one story.
requires-python = ">=3.12"
authors = [
    { name = "fpstune" }
]
keywords = ["gaming", "optimization", "windows", "performance", "fps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    # Only versions CI actually runs are listed. 3.11 was declared here for a
    # year and never executed once, which is a support claim nobody could have
    # falsified; a narrower range that is true beats a wider one that is not.
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Hardware",
]
dependencies = [
    "click>=8.3.1",
    "rich>=14.2.0",
    "pyyaml>=6.0.3",
    "pydantic>=2.12.5",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "sse-starlette>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
    "httpx2>=2.4.0",
    "pyinstaller>=6.0",
]

[project.scripts]
fpstune = "fpstune.cli:main"

[project.urls]
Homepage = "https://github.com/sungurerdim/fpstune"
Documentation = "https://github.com/sungurerdim/fpstune#readme"
Repository = "https://github.com/sungurerdim/fpstune"
Issues = "https://github.com/sungurerdim/fpstune/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fpstune"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["fpstune"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/fpstune"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if sys.platform != 'win32':",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
# Set just under what the suite actually reaches, not aspirationally above it.
# Measured 2026-08-26: 73.65% over 3117 passing tests. The previous floor of 40
# was a number this suite could not cross, so it reported green on every run and
# diagnosed nothing; 70 leaves room for ordinary work while a real regression —
# a module that stops being exercised — lands below it.
# Ratcheted, never lowered (H4): measured 80.15% on 2026-08-26 after the CLI
# benchmark tree, the power-profile routes and the result loaders gained
# their tests. Raise it as further uncovered areas gain tests; a change that
# drops coverage below this is a change that removed a guard.
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"
