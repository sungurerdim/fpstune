[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpstune"
version = "0.2.2"
description = "Windows gaming performance optimization tool"
readme = "README.md"
license = "MIT"
# The floor is the oldest version CI runs, and nothing else. Raised from 3.11
# because nothing was holding it there — no dependency in uv.lock stops at 3.11
# and no syntax in src/ needs it — while nothing ran it either. An untested
# floor is a promise about an interpreter nobody ever started. Keep this, the
# classifiers, ruff's target-version, mypy's python_version and the CI matrix
# telling one story.
requires-python = ">=3.12"
authors = [
    { name = "fpstune" }
]
keywords = ["gaming", "optimization", "windows", "performance", "fps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    # Only versions CI actually runs are listed. 3.11 was declared here for a
    # year and never executed once, which is a support claim nobody could have
    # falsified; a narrower range that is true beats a wider one that is not.
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Hardware",
]
dependencies = [
    "click>=8.3.1",
    "rich>=14.2.0",
    "pydantic>=2.12.5",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "pyyaml>=6.0.3",
    # Node.js for building the UI, so a source checkout needs nothing but uv.
    "nodejs-wheel>=24.19.0",
    "httpx2>=2.4.0",
    "pyinstaller>=6.0",
    "pytest-xdist>=3.8.0",
    "import-linter>=2.15",
    "vulture>=2.16",
    "zizmor>=1.31.1",
    "mutmut==2.4.4",
]

[project.scripts]
fpstune = "fpstune.cli:run"

[project.urls]
Homepage = "https://github.com/sungurerdim/fpstune"
Documentation = "https://github.com/sungurerdim/fpstune#readme"
Repository = "https://github.com/sungurerdim/fpstune"
Issues = "https://github.com/sungurerdim/fpstune/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fpstune"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    # P-EXPLICIT (docs/PRINCIPLES.md): a broad `except` and a silent
    # `try/except/pass` are the two shapes a swallowed failure takes. Both are
    # allowed only with a written reason on the line (`# noqa: BLE001 - why`).
    "BLE",    # flake8-blind-except
    "S110",   # try-except-pass
    "S112",   # try-except-continue
    # P-KISS: the catalogue's complexity ceiling of 20. Three functions were
    # extracted when this landed; there is no C901 noqa.
    "C901",   # mccabe complexity
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = ["fpstune"]

[tool.mypy]
python_version = "3.12"
# The product runs on Windows only and CI type-checks on windows-latest; checking
# for the host platform reports every winreg/ctypes.WinDLL use on macOS/Linux.
platform = "win32"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
# A test silent this long prints every thread's stack: a hang on the Windows
# runner (where a cancelled run's log is lost) names itself.
faulthandler_timeout = 300
pythonpath = ["src"]
# A test whose verdict is a wall-clock reading. Beside eight workers the
# scheduler takes the core away mid-measurement (measured: the PowerShell stall
# contract reads late enough to fail), so scripts/quality.sh runs these on their
# own once the parallel block is done, instead of loosening their bounds.
markers = [
    "timing: asserts on wall-clock behaviour; run on a quiet machine, not beside parallel load",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/fpstune"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if sys.platform != 'win32':",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
# Set just under what the suite actually reaches, not aspirationally above it.
# Measured 2026-08-26: 73.65% over 3117 passing tests. The previous floor of 40
# was a number this suite could not cross, so it reported green on every run and
# diagnosed nothing; 70 leaves room for ordinary work while a real regression —
# a module that stops being exercised — lands below it.
# Ratcheted, never lowered (H4): measured 80.15% on 2026-08-26 after the CLI
# benchmark tree, the power-profile routes and the result loaders gained
# their tests. Raise it as further uncovered areas gain tests; a change that
# drops coverage below this is a change that removed a guard.
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.mutmut]
# P-MUTATION (docs/PRINCIPLES.md): the two critical pure modules. Mutation
# testing is a manual gate (scripts/mutation.sh) because it re-runs pytest per
# mutant and mutates the tree in place; the floor is measured, never aspirational.
# The runner is scoped to these modules' own tests on purpose: the whole suite per
# mutant would cost the full quality gate hundreds of times.
#
# Windows-native by construction: mutmut 2.4.4 is the last release that runs on
# Windows (3.x refuses with "please use the WSL", boxed/mutmut#397) and this
# project ships to Windows 11 only, so the gate must not require WSL. The version
# is pinned in the dev extra and scripts/mutation.sh refuses anything else.
paths_to_mutate = [
    "src/fpstune/settings/applicability.py",
    "src/fpstune/settings/bulk_plan.py",
]
runner = "python -m pytest -x -q --no-cov tests/test_settings/test_applicability.py tests/test_settings/test_bulk_plan.py"
test_time_multiplier = 4.0
