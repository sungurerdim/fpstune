name: Bug report
description: A setting detected wrong, applied wrong, or fpstune itself misbehaved
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most fpstune bugs are hardware-specific: a driver spells a keyword
        differently, or reports a value nobody expected. The hardware details
        below are what make such a report actionable, so please fill them in
        even if they feel irrelevant.

        If this is a security issue, do not file it here — see
        [SECURITY.md](../../blob/main/SECURITY.md).

  - type: input
    id: setting
    attributes:
      label: Which setting?
      description: The setting ID or its display name. "All of them" is a valid answer.
      placeholder: "network:14:rss_queues — RSS Queue Count (Ethernet)"

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect instead?
      placeholder: |
        fpstune showed "16" as the current value but the dropdown only offered
        1, 2 and 4, so Apply never reported success.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Network category
        2. Select RSS Queue Count
        3. Apply
    validations:
      required: true

  - type: dropdown
    id: admin
    attributes:
      label: Was fpstune running as Administrator?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: system
    attributes:
      label: System
      description: |
        Run `winver` for the build, and paste the Hardware panel contents if you
        can reach it. CPU, GPU and — for a network bug — the exact NIC model.
      placeholder: |
        Windows 11 23H2 (22631.4460)
        CPU: AMD Ryzen 7 5800X
        GPU: NVIDIA RTX 4070
        NIC: Realtek Gaming 2.5GbE Family Controller
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: fpstune version
      description: The release tag, or the commit hash if you built from source.
      placeholder: "v0.1.0, or 4c1f2ab"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: |
        Anything from the console, or the error text the UI showed. Optional,
        but it usually turns a guess into a diagnosis.
      render: text
