PackageIdentifier: sungurerdim.fpstune
PackageVersion: 0.1.0
ReleaseDate: 2026-08-26
InstallerType: portable
# One file, nothing to unpack, no uninstaller to leave behind. `portable` is the
# honest type for that; calling it an installer would have winget promise an
# Add/Remove Programs entry that does not exist.
Commands:
  - fpstune
# fpstune writes to HKLM, service start types and power schemes, so the binary
# carries an elevation manifest and Windows prompts on launch. Declaring it here
# means winget knows the install itself needs elevation too, rather than failing
# halfway through.
ElevationRequirement: elevatesSelf
InstallModes:
  - interactive
  - silent
# No ReleaseDate here on purpose, still: the script inserts it directly under
# PackageVersion from the day the release is published. Typing one in would put
# a date nobody released on into every future version, which is the whole reason
# the field moved into the script.
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/sungurerdim/fpstune/releases/download/v0.1.0/fpstune.exe
    # Filled in by scripts/update_winget_manifest.py from the published
    # fpstune.exe.sha256, never typed by hand — a checksum copied by a person is
    # a checksum nobody verified.
    InstallerSha256: 816f3cdd085c6521f9ea5b428129a46503e19612629ac57ddcae99da57599ca8
ManifestType: installer
ManifestVersion: 1.6.0
