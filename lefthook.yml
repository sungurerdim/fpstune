# Two lanes, not seven commands at once.
#
# `parallel: true` over every command started ruff, mypy, pytest, eslint, tsc
# and vitest together on the same machine, and vitest is the one that cannot
# survive it: its workers are separate processes that must answer a handshake
# within a timeout, and under that much contention they do not. The failure
# reads `[vitest-pool]: Failed to start ... worker ... Timeout waiting for
# worker to respond`, and a run that loses workers reports the suites that did
# start — 12 of 57 in one observed run — with zero failing tests. A gate that
# can pass without having run is worse than a slow one.
#
# Both pools show it under the hook, so it is not the pool: measured with the
# machine otherwise idle, forks started all 57 suites in 6 of 6 runs and
# threads in 3 of 6, which is why `vitest.config.ts` prefers forks — but inside
# the old parallel hook even forks lost twelve workers.
#
# So the checks are grouped: Python and frontend still run at the same time,
# because they contend for different tools, and within each group the steps run
# one after another. The wall clock is set by the Python group, which ends in
# the full pytest run either way.
# pre-commit keeps what answers in seconds (lint and format), the tests selected
# by what changed (scripts/affected_tests.py), and the three whole-tree checks
# that are cheapest here (secret scan, diff budget, control registry). Types and
# the full test run ran here too and made every commit wait ~45 s for checks
# pre-push runs anyway; one place for the slow half is enough.
pre-commit:
  parallel: true
  jobs:
    # Every commit, whatever it touches: a secret, an unbounded diff and a
    # control registry that has drifted from the stage files are all cheapest to
    # catch here (P-SECRETS, P-SMALLBATCH/P-BOYSCOUT, P-SHIFTLEFT/P-SSOT). No
    # glob on purpose: a doc-only commit can add a credential too.
    - name: change-size
      group:
        piped: true
        jobs:
          # The dependency-free scan is the local gate; CI runs the real
          # gitleaks binary (not a project dependency, so it cannot be required
          # of every contributor's machine).
          - name: py-secret-scan
            run: uv run --extra dev pytest -q --no-cov tests/test_principles_security.py
          - name: py-diff-budget
            run: uv run --extra dev python scripts/diff_budget.py --staged
          - name: py-control-registry
            run: uv run --extra dev python scripts/controls.py --check

    - name: python
      glob: "*.py"
      group:
        piped: true
        jobs:
          - name: py-lint
            run: uv run --extra dev ruff check src tests scripts
          - name: py-format
            run: uv run --extra dev ruff format --check src tests scripts
          # The tests that import or name a staged file, so a red the change
          # causes is seen by that change and not first by the full gate on push
          # (#104: eleven contract tests over definitions/network.py). Python
          # changes only (the glob above): a doc-only commit never reaches it.
          - name: py-affected-tests
            run: uv run --extra dev python scripts/affected_tests.py --staged --run

    - name: frontend
      glob: "frontend/*"
      root: frontend/
      group:
        piped: true
        jobs:
          - name: fe-lint
            run: npm run lint

commit-msg:
  commands:
    # Checks the subject line only. Reading the file with grep rather than
    # interpolating it into the shell keeps a message containing quotes,
    # backticks or newlines from being re-parsed as script.
    conventional:
      fail_text: Conventional commit required. Subject must start with feat, fix, docs, style, refactor, perf, test, build, ci, chore or revert.
      run: |
        grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+' {1}

# The whole CI contract before anything leaves the machine, so a red run is
# caught here instead of spending Actions minutes (CI runs on demand only).
pre-push:
  commands:
    quality:
      run: bash scripts/quality.sh
