<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before first paint: light unless the user chose dark. Only the
         explicit choice (localStorage) moves it; the OS preference is not read.
         The script runs before any CSS applies to content, so a dark-theme user
         never sees a light flash. lib/theme.ts applies the same rule afterwards,
         and theme.test.ts runs this very script against it. -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem("fpstune-theme") === "dark";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* storage blocked: keep the light default */
        }
      })();
    </script>
    <!-- No favicon link: there is no `public/` directory, so `/vite.svg` was a
         404 on every single page load. An inline data-URI keeps the browser
         from asking at all. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f172a'/><path d='M9 23V9h13v3.4h-9.2v2.6H21v3.4h-8.2V23z' fill='%2338bdf8'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fpstune - Windows Gaming Optimizer</title>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
