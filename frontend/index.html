<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before first paint: an explicit choice (localStorage) wins,
         otherwise the OS preference decides. The class="dark" above is only
         the pre-script default, so a light-mode user never sees a dark
         flash inverted — the script runs before any CSS applies to content. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("fpstune-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage blocked: keep the dark default */
        }
      })();
    </script>
    <!-- No favicon link: there is no `public/` directory, so `/vite.svg` was a
         404 on every single page load. An inline data-URI keeps the browser
         from asking at all. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f172a'/><path d='M9 23V9h13v3.4h-9.2v2.6H21v3.4h-8.2V23z' fill='%2338bdf8'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fpstune - Windows Gaming Optimizer</title>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
