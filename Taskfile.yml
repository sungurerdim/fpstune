# Taskfile for fpstune. Install go-task once: https://taskfile.dev/installation/
# Then run: task <name>. Run `task` with no args to list everything.
# Everything goes through uv, which also provides Python 3.12 and Node.js
# (the dev extra installs the nodejs-wheel package), so nothing else is needed.
version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  install:
    desc: Python (from uv.lock), Node.js and the UI's node_modules
    cmds:
      - uv sync --locked --extra dev
      - cd frontend && uv run --locked npm ci

  lock:
    desc: Regenerate uv.lock from pyproject.toml
    cmds:
      - uv lock

  lock-check:
    desc: Fail if uv.lock has drifted from pyproject.toml (CI installs with --locked)
    cmds:
      - uv lock --check

  lint:
    desc: ruff + mypy
    cmds:
      - uv run ruff check src tests
      - uv run ruff format --check src tests
      - uv run mypy src

  fmt:
    desc: Auto-format Python with ruff
    cmds:
      - uv run ruff format src tests
      - uv run ruff check --fix src tests

  test:
    desc: pytest with the coverage gate
    cmds:
      - uv run pytest -v --tb=short --cov=src/fpstune --cov-report=term-missing

  test-fast:
    desc: pytest without coverage
    cmds:
      - uv run pytest --no-cov -q

  test-frontend:
    desc: vitest
    dir: frontend
    cmds:
      - uv run --locked npm run test:run

  test-all:
    desc: Backend + frontend tests
    deps: [test-fast, test-frontend]

  serve:
    desc: Start fpstune from source (builds the UI first when it is stale)
    cmds:
      - uv run fpstune serve

  dev:
    desc: Start fpstune with the Vite dev server and live reload
    cmds:
      - uv run fpstune serve --dev

  build:
    desc: Build dist\fpstune.exe the way CI does (UI first, then PyInstaller)
    cmds:
      - cmd /c build_exe.bat --no-pause

  winget:
    desc: Point the winget manifests at a built exe (submission stays manual)
    cmds:
      # Nothing here submits: it writes winget/manifests/... The winget-pkgs
      # pull request is a deliberate human step, because the binary is unsigned
      # and every submission of it goes to human review anyway.
      - uv run python scripts/update_winget_manifest.py --exe dist/fpstune.exe

  clean:
    desc: Remove build / cache artifacts
    cmds:
      - cmd: rm -rf build dist .pytest_cache .ruff_cache .mypy_cache htmlcov
        ignore_error: true
