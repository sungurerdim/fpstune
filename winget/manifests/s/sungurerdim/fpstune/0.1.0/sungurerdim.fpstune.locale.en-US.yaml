ShortDescription: Tunes Windows 11 to the ceiling the machine and the connection can actually reach.
Description: |-
  fpstune reads what your hardware reports it can do and tunes to that, rather
  than applying a preset. The panel's own maximum refresh, the network adapter's
  own accepted values, the card's own VRAM: a setting whose correct value depends
  on the machine is derived from the machine, and one that cannot be derived is
  not offered.

  Every change is applied, read back and verified, so a write that silently
  failed is reported rather than assumed. Every change has two ways back: restore
  the Windows default, or undo to what this machine held before fpstune first saw
  it. A System Restore point is created before anything is written.

  Requires Administrator. It edits HKLM values, service start types, power
  schemes and network adapter driver keywords, none of which are writable
  otherwise. No telemetry, no account, no bundled software.
